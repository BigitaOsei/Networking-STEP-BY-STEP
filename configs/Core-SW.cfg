! Core-SW Configuration
! TechStart Ltd Project

enable
configure terminal

hostname Core-SW
enable secret Cisco@123
no ip domain-lookup
service password-encryption
banner motd # Unauthorized Access is Prohibited #

line console 0
 password Cisco@123
 login
 exec-timeout 5 0
exit

line vty 0 15
 password Cisco@123
 login
 transport input ssh telnet
exit

vlan 10
 name Sales
vlan 20
 name Engineering
vlan 30
 name Management
vlan 40
 name Servers
vlan 99
 name Mgmt
exit

interface range FastEthernet0/1-8
 description Sales PCs
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

interface range FastEthernet0/9-14
 description Engineering PCs
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit

interface range FastEthernet0/15-18
 description Management PCs
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit

interface range FastEthernet0/19-20
 description Servers
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
exit

interface FastEthernet0/24
 description Trunk to Router
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,99
 switchport trunk native vlan 99
 no shutdown
exit

interface vlan 99
 description Switch Management
 ip address 192.168.99.2 255.255.255.0
 no shutdown
exit

ip default-gateway 192.168.99.1

end
copy running-config startup-config
